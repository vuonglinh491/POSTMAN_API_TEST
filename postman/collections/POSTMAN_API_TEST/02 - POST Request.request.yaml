      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData.json.name).to.eql(\"Ngô Vương Linh\");\r

      });\r

      \r

      pm.test(\"Age is correct\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData.json.age).to.eql(21);\r

      });"
